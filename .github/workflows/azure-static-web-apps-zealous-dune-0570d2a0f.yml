name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - production

  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - production

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    runs-on: ubuntu-latest

    name: Build and Deploy Job

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          rm -rf node_modules
          npm ci --include=dev

      - name: Verify Angular CLI
        working-directory: ./frontend
        run: |
          npm list @angular/cli
          test -f node_modules/@angular/cli/bin/ng.js
          echo "Angular CLI is installed correctly."

      - name: Build Angular
        working-directory: ./frontend
        run: |
          chmod +x node_modules/@angular/cli/bin/ng.js
          node node_modules/@angular/cli/bin/ng.js build

      - name: Check Angular build output
        run: |
          echo "Files inside frontend/dist:"
          find frontend/dist -maxdepth 4 -type f | sort

          echo ""
          echo "Searching for index.html:"
          find frontend/dist -name index.html -print

      - name: Prepare deployment folder
        run: |
          mkdir -p frontend/deploy

          INDEX_FILE=$(find frontend/dist -name index.html -print -quit)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found anywhere inside frontend/dist"
            exit 1
          fi

          echo "Found index.html at: $INDEX_FILE"

          BUILD_FOLDER=$(dirname "$INDEX_FILE")

          echo "Copying Angular build from: $BUILD_FOLDER"

          cp -R "$BUILD_FOLDER"/. frontend/deploy/

          if [ -f frontend/staticwebapp.config.json ]; then
            cp frontend/staticwebapp.config.json frontend/deploy/staticwebapp.config.json
          fi

          echo ""
          echo "Deployment folder contents:"
          find frontend/deploy -maxdepth 2 -type f | sort

      - name: Verify deployment folder
        run: |
          test -f frontend/deploy/index.html
          echo "index.html found successfully."
          echo "Ready for Azure Static Web Apps deployment."

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_DUNE_0570D2A0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend/deploy"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    runs-on: ubuntu-latest

    name: Close Pull Request

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_DUNE_0570D2A0F }}
          action: "close"