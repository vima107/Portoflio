name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - production

  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - production

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    runs-on: ubuntu-latest

    name: Build and Deploy Job

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          rm -rf node_modules
          npm ci --include=dev

      - name: Verify Angular CLI
        working-directory: ./frontend
        run: |
          npm list @angular/cli
          test -f node_modules/@angular/cli/bin/ng.js
          echo "Angular CLI is installed correctly."

      - name: Build Angular
        working-directory: ./frontend
        run: |
          chmod +x node_modules/@angular/cli/bin/ng.js
          node node_modules/@angular/cli/bin/ng.js build

      - name: Copy Static Web Apps config
        run: |
          cp frontend/staticwebapp.config.json frontend/dist/portfolio-1/staticwebapp.config.json

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_DUNE_0570D2A0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend/dist/portfolio-1"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    runs-on: ubuntu-latest

    name: Close Pull Request

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_DUNE_0570D2A0F }}
          action: "close"